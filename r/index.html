<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<title>스타일 — 해담</title>
<meta name="description" content="해담 스타일을 확인하고 앱에서 열어보세요.">
<meta name="theme-color" content="#0E0E0F">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/style.css">
<meta property="og:type" content="website">
<meta property="og:site_name" content="해담">
<meta property="og:title" content="해담 스타일">
<meta property="og:description" content="열면 보정 전후 사진과 모든 수치를 볼 수 있어요. 해담 앱에서 바로 써보세요.">
<meta property="og:url" content="https://haedam.jiun.dev/r/">
<meta property="og:image" content="https://haedam.jiun.dev/assets/og-recipe.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://haedam.jiun.dev/assets/og-recipe.jpg">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../"><svg class="brand-mark" aria-hidden="true" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="hm"><rect x="20" y="18" width="80" height="43"/></clipPath></defs><path d="M14 38V22a8 8 0 0 1 8-8h16M82 14h16a8 8 0 0 1 8 8v16M106 82v16a8 8 0 0 1-8 8H82M38 106H22a8 8 0 0 1-8-8V82" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="57" r="17" fill="var(--accent)" clip-path="url(#hm)"/><defs><mask id="hm-refl" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><image href="../assets/reflection-mask.png" x="0" y="0" width="120" height="120"/></mask></defs><rect width="120" height="120" fill="var(--accent)" mask="url(#hm-refl)"/></svg>해담</a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="../#looks">스타일</a>
      <a href="../community/">커뮤니티</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <span class="eyebrow">스타일</span>
  </div>

  <div id="view" hidden>
    <div class="card recipe-hero">
      <div class="preview">
        <div class="shot" id="shot" role="button" aria-pressed="false" tabindex="0" aria-label="스타일 미리보기, 누르고 있으면 원본">
          <img id="pv-base" alt="">
          <canvas id="pv-canvas" width="540" height="675" aria-hidden="true"></canvas>
          <span class="sweep" aria-hidden="true"></span>
          <img class="after" id="pv-after" alt="" hidden>
          <img class="before" id="pv-before" alt="">
          <span class="hint">누르고 있으면 원본</span>
          <span class="busy" id="pv-busy" role="status" aria-live="polite" hidden><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="pv-busy-text">스타일 입히는 중</span></span>
        </div>
        <div class="chips samples" id="samples" role="group" aria-label="예시 사진 고르기"></div>
      </div>
      <div>
        <h1 id="name"></h1>
        <p class="meta" id="meta"></p>
        <div class="btn-row">
          <a class="btn btn-accent" id="open-app" href="#">앱에서 열기</a>
          <button class="btn" type="button" id="copy">링크 복사</button>
        </div>
      </div>
    </div>

    <div class="groups" id="groups"></div>

    <div class="card note">
      <strong>Apple 사진 앱 근사값</strong> — 여기 나온 수치는 해담 렌더러 기준이에요. 사진 앱에 같은 이름의 항목이 있어도 계산 방식이 달라서 결과가 조금 다를 수 있어요. 따라 할 땐 참고용으로만 봐주세요.
    </div>
  </div>

  <div id="error" class="card empty" hidden>
    <div class="icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg></div>
    <h2 id="error-title">스타일을 열 수 없어요</h2>
    <p id="error-msg">링크가 잘렸거나 잘못된 것 같아요. 보내준 사람에게 링크를 다시 받아보세요.</p>
    <div class="btn-row">
      <a class="btn btn-accent" href="../community/">커뮤니티 스타일 보기</a>
      <a class="btn" href="../">홈으로</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 해담</span>
    <a href="../community/">커뮤니티 스타일</a>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/recipe.js"></script>
<script src="../assets/recipe-page.js"></script>
</body>
</html>
