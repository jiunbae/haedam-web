<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<title>레시피 — 해담</title>
<meta name="description" content="해담 레시피를 확인하고 앱에서 열어보세요.">
<meta name="theme-color" content="#0E0E0F">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../"><svg class="brand-mark" aria-hidden="true" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="hm"><rect x="20" y="18" width="80" height="43"/></clipPath></defs><path d="M14 38V22a8 8 0 0 1 8-8h16M82 14h16a8 8 0 0 1 8 8v16M106 82v16a8 8 0 0 1-8 8H82M38 106H22a8 8 0 0 1-8-8V82" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="57" r="17" fill="var(--accent)" clip-path="url(#hm)"/><defs><mask id="hm-refl" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><image href="../assets/reflection-mask.png" x="0" y="0" width="120" height="120"/></mask></defs><rect width="120" height="120" fill="var(--accent)" mask="url(#hm-refl)"/></svg>해담</a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="../#looks">룩</a>
      <a href="../community/">커뮤니티</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <span class="eyebrow">레시피</span>
  </div>

  <div id="view" hidden>
    <div class="card recipe-hero">
      <div class="preview">
        <div class="shot" id="shot" role="button" aria-pressed="false" tabindex="0" aria-label="레시피 미리보기, 누르고 있으면 원본">
          <img id="pv-base" alt="">
          <canvas id="pv-canvas" width="540" height="675" aria-hidden="true"></canvas>
          <span class="sweep" aria-hidden="true"></span>
          <img class="after" id="pv-after" alt="" hidden>
          <img class="before" id="pv-before" alt="">
          <span class="hint">누르고 있으면 원본</span>
          <span class="busy" id="pv-busy" role="status" aria-live="polite" hidden><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="pv-busy-text">레시피 입히는 중</span></span>
        </div>
        <div class="chips samples" id="samples" role="group" aria-label="예시 사진 고르기"></div>
      </div>
      <div>
        <h1 id="name"></h1>
        <p class="meta" id="meta"></p>
        <div class="btn-row">
          <a class="btn btn-accent" id="open-app" href="#">앱에서 열기</a>
          <button class="btn" type="button" id="copy">링크 복사</button>
        </div>
      </div>
    </div>

    <div class="groups" id="groups"></div>

    <div class="card note">
      <strong>Apple 사진 앱 근사값</strong> — 여기 나온 수치는 해담 렌더러 기준이에요. 사진 앱에 같은 이름의 항목이 있어도 계산 방식이 달라서 결과가 조금 다를 수 있어요. 따라 할 땐 참고용으로만 봐주세요.
    </div>
  </div>

  <div id="error" class="card empty" hidden>
    <div class="icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg></div>
    <h2 id="error-title">레시피를 열 수 없어요</h2>
    <p id="error-msg">링크가 잘렸거나 잘못된 것 같아요. 보내준 사람에게 링크를 다시 받아보세요.</p>
    <div class="btn-row">
      <a class="btn btn-accent" href="../community/">커뮤니티 레시피 보기</a>
      <a class="btn" href="../">홈으로</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 해담</span>
    <a href="../community/">커뮤니티 레시피</a>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/recipe.js"></script>
<script>
(function () {
  "use strict";
  var R = window.HaedamRecipe;
  var $ = function (id) { return document.getElementById(id); };

  function fmt(row) {
    if (row.hue) return row.value + "°";
    return (row.value > 0 ? "+" : "") + row.value;
  }

  function showError(msg) {
    $("view").hidden = true;
    $("error").hidden = false;
    if (msg) $("error-msg").textContent = msg + ". 보내준 사람에게 링크를 다시 받아보세요.";
    document.title = "레시피를 열 수 없어요 — 해담";
  }

  // --- live preview: the recipe on example photos, drawn by render.js in a worker ---
  var SAMPLES = [
    { id: "walk", label: "골목" }, { id: "cafe", label: "커피" }, { id: "dinner", label: "식탁" },
    { id: "river-sunset", label: "노을" }, { id: "green-forest", label: "숲" }, { id: "night-walk", label: "밤거리" }
  ];
  var worker = null, job = 0, current = null, previewGeneration = 0;
  var working = false, pending = null, watchdog = null, started = 0;

  function pixels(img, w, h) {
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var ctx = c.getContext("2d", { willReadFrequently: true }); ctx.drawImage(img, 0, 0, w, h);
    var d = ctx.getImageData(0, 0, w, h).data, out = new Float32Array(w * h * 3);
    for (var i = 0, j = 0; i < d.length; i += 4, j += 3) { out[j] = d[i] / 255; out[j + 1] = d[i + 1] / 255; out[j + 2] = d[i + 2] / 255; }
    return out;
  }

  function loadImage(src) {
    return new Promise(function (ok, fail) {
      var im = new Image(), timer = setTimeout(function () { im.src = ""; fail(new Error("image timeout")); }, 15000);
      im.decoding = "async";
      im.onload = function () { clearTimeout(timer); ok(im); };
      im.onerror = function () { clearTimeout(timer); fail(new Error("image load")); };
      im.src = src;
    });
  }

  function discardPending() {
    if (pending && pending.data.bitmap) pending.data.bitmap.close();
    pending = null;
  }

  function previewError(message, id) {
    if (id != null && id !== job) return;
    $("shot").classList.remove("loading");
    $("pv-busy").hidden = false;
    $("pv-busy").classList.add("done");
    $("pv-busy-text").textContent = message;
  }

  function stopWorker() {
    clearTimeout(watchdog);
    if (worker) worker.terminate();
    worker = null; working = false; discardPending();
  }

  function send(data, transfers) {
    if (working) { discardPending(); pending = { data: data, transfers: transfers }; return; }
    working = true;
    watchdog = setTimeout(function () {
      stopWorker(); previewError("미리보기가 지연돼요. 예시 사진을 다시 골라주세요.");
    }, 15000);
    try { worker.postMessage(data, transfers); }
    catch (error) { if (data.bitmap) data.bitmap.close(); stopWorker(); previewError("이 브라우저에서는 미리보기를 만들지 못했어요."); }
  }

  function ensureWorker() {
    if (worker) return;
    worker = new Worker("../assets/render-worker.js");
    var active = worker;
    worker.onerror = worker.onmessageerror = function () {
      if (worker !== active) return;
      stopWorker(); previewError("미리보기를 불러오지 못했어요. 예시 사진을 다시 골라주세요.");
    };
    worker.onmessage = function (e) {
      if (worker !== active) return;
      clearTimeout(watchdog); working = false;
      if (e.data.id === job) {
        if (e.data.error) previewError(e.data.error, e.data.id);
        else {
          var canvas = $("pv-canvas"), shot = $("shot");
          canvas.getContext("2d").putImageData(new ImageData(e.data.rgba, e.data.w, e.data.h), 0, 0);
          shot.classList.remove("loading");
          void canvas.offsetWidth;
          canvas.classList.add("reveal"); canvas.style.clipPath = "inset(0 0 0 0)";
          if (/[?&]timing=1/.test(location.search)) {
            $("pv-busy").classList.add("done");
            $("pv-busy-text").textContent = "완료 " + Math.round(performance.now() - started) + "ms";
            // Plain text too: Safari doesn't expose role=status contents to UI tests.
            var t = $("pv-timing") || document.body.appendChild(Object.assign(document.createElement("p"), { id: "pv-timing", className: "timing" }));
            t.textContent = "완료 " + Math.round(performance.now() - started) + "ms";
          } else $("pv-busy").hidden = true;
        }
      }
      if (pending) { var next = pending; pending = null; send(next.data, next.transfers); }
    };
  }

  function showSample(sample, recipe) {
    var id = ++job;
    discardPending();
    document.querySelectorAll("#samples button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.id === sample.key ? "true" : "false"); });
    var before = $("pv-before"), after = $("pv-after"), canvas = $("pv-canvas"), base = $("pv-base"), shot = $("shot");
    before.src = "../assets/photos/r/" + sample.id + "-before.jpg";
    base.src = before.src;
    shot.classList.remove("show-before"); shot.setAttribute("aria-pressed", "false");
    if (sample.prerendered) {
      stopWorker();
      after.src = "../" + sample.prerendered; after.alt = recipe.name + " 레시피를 입힌 사진"; after.hidden = false;
      canvas.hidden = true; base.hidden = true; $("pv-busy").hidden = true; shot.classList.remove("loading");
      return;
    }
    after.hidden = true; canvas.hidden = false; base.hidden = false; $("pv-busy").hidden = false;
    $("pv-busy-text").textContent = "레시피 입히는 중"; $("pv-busy").classList.remove("done");
    if ($("pv-timing")) $("pv-timing").textContent = "";
    shot.classList.add("loading");
    canvas.classList.remove("reveal"); canvas.style.clipPath = "inset(0 100% 0 0)";
    started = performance.now();
    loadImage(before.src).then(async function (img) {
      if (id !== job) return;
      ensureWorker();
      var data = { id: id, key: sample.id, w: 540, h: 675, sw: 205, sh: 256, params: recipe.params, keepCast: recipe.keepCast };
      var bitmap = window.createImageBitmap ? await createImageBitmap(img) : null;
      if (id !== job) { if (bitmap) bitmap.close(); return; }
      if (window.OffscreenCanvas && bitmap) {
        data.bitmap = bitmap;
        send(data, [bitmap]);
      } else {
        try { data.px = pixels(bitmap || img, 540, 675); data.small = pixels(bitmap || img, 205, 256); }
        finally { if (bitmap) bitmap.close(); }
        send(data, [data.px.buffer, data.small.buffer]);
      }
    }).catch(function () { previewError("사진이나 미리보기를 불러오지 못했어요. 다시 골라주세요.", id); });
  }

  function preview(recipe, payload) {
    current = recipe;
    var generation = ++previewGeneration;
    ++job; stopWorker();  // Hash changes cannot publish an old recipe or queued work.
    // Warm only the tiny first job; no large source arrays are copied.
    if (window.Worker) {
      try {
        ensureWorker();
        var warm = new Float32Array(64 * 80 * 3).fill(0.5);
        send({ id: -1, key: "warm", px: warm, small: warm, w: 64, h: 80, sw: 64, sh: 80,
          params: recipe.params, keepCast: recipe.keepCast }, [warm.buffer]);
      } catch (error) { stopWorker(); }
    }
    var box = $("samples"), list = SAMPLES.map(function (s) { return { key: s.id, id: s.id, label: s.label }; });
    function draw() {
      if (generation !== previewGeneration) return;
      box.textContent = "";
      list.forEach(function (s) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = s.label; b.dataset.id = s.key;
        b.addEventListener("click", function () { showSample(s, current); });
        box.appendChild(b);
      });
      showSample(list[0], recipe);
    }
    // A community recipe starts on its own example photo (already rendered).
    var controller = new AbortController();
    var feedTimer = setTimeout(function () { controller.abort(); }, 2500);
    fetch("../community/feed.json", { signal: controller.signal }).then(function (res) { if (!res.ok) throw new Error("feed"); return res.json(); }).then(function (feed) {
      var hit = (feed.recipes || []).filter(function (r) { return r.payload === payload; })[0];
      var ok = function (p) { return typeof p === "string" && /^assets\/photos\/r\/[a-z0-9-]+\.jpg$/.test(p); };
      if (generation === previewGeneration && hit && ok(hit.image) && typeof hit.id === "string" && /^[a-z0-9-]+$/.test(hit.id)) {
        list = list.filter(function (s) { return s.id !== hit.id; });
        list.unshift({ key: "own", id: hit.id, label: "예시", prerendered: hit.image });
      }
    }).catch(function () {}).then(function () { clearTimeout(feedTimer); draw(); });
  }

  function holdToCompare(node) {
    function on() { node.classList.add("show-before"); node.setAttribute("aria-pressed", "true"); }
    function off() { node.classList.remove("show-before"); node.setAttribute("aria-pressed", "false"); }
    node.addEventListener("pointerdown", on);
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { node.addEventListener(t, off); });
    node.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); on(); } });
    node.addEventListener("keyup", off);
    node.addEventListener("blur", off);
    node.addEventListener("click", function (e) { if (e.detail === 0) { if (node.classList.contains("show-before")) off(); else on(); } });
    node.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }
  holdToCompare($("shot"));

  function render() {
    ++previewGeneration; ++job; stopWorker();
    var payload = location.hash.replace(/^#/, "");
    if (!payload) {
      $("error-title").textContent = "레시피 링크가 비어 있어요";
      showError("주소 뒤에 레시피 정보가 없어요");
      return;
    }
    var recipe;
    try { recipe = R.decode(payload); } catch (e) { showError(e.message); return; }

    $("error").hidden = true;
    $("view").hidden = false;
    $("name").textContent = recipe.name;
    document.title = recipe.name + " — 해담 레시피";

    var count = Object.keys(recipe.params).length;
    $("meta").textContent = "조정한 항목 " + count + "개 · 원래 색 유지 " + Math.round(recipe.keepCast * 100) + "%";
    preview(recipe, payload);
    $("open-app").href = "haedam://recipe#" + payload;

    var box = $("groups");
    box.textContent = "";
    var groups = R.grouped(recipe.params);
    if (!groups.length) {
      var empty = document.createElement("div");
      empty.className = "card note";
      empty.textContent = "추가한 조정 값이 없어요. 예시에는 사진에 맞춘 기본 보정이 적용돼요.";
      box.appendChild(empty);
    }
    groups.forEach(function (g) {
      var card = document.createElement("section");
      card.className = "card group";
      var h = document.createElement("h2");
      h.textContent = g.label;
      card.appendChild(h);
      var table = document.createElement("table");
      g.rows.forEach(function (row) {
        var tr = document.createElement("tr");
        var td1 = document.createElement("td");
        if (row.hue) {
          var dot = document.createElement("span");
          dot.className = "hue-dot";
          dot.style.background = "hsl(" + row.value + " 60% 60%)";
          td1.appendChild(dot);
        }
        td1.appendChild(document.createTextNode(row.label));
        var td2 = document.createElement("td");
        td2.className = "v " + (row.value > 0 ? "pos" : "neg");
        td2.textContent = fmt(row);
        tr.appendChild(td1);
        tr.appendChild(td2);
        table.appendChild(tr);
      });
      card.appendChild(table);
      box.appendChild(card);
    });
  }

  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  $("copy").addEventListener("click", function () {
    var url = location.href;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(
        function () { toast("링크를 복사했어요"); },
        function () { toast(fallbackCopy(url) ? "링크를 복사했어요" : "복사하지 못했어요"); }
      );
    } else {
      toast(fallbackCopy(url) ? "링크를 복사했어요" : "복사하지 못했어요");
    }
  });

  window.addEventListener("pagehide", stopWorker);
  window.addEventListener("pageshow", function (e) { if (e.persisted) render(); });
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
